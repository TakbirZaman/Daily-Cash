name: daily_cash
description: Personal daily ledger.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.19.0
  phosphor_flutter: ^2.1.0
  table_calendar: ^3.1.2
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  excel: ^4.0.6
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
